<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steam 环境修复 · 交互演示</title><style>
:root{color-scheme:dark;--bg:#13161c;--panel:#1c2028;--card:#252a34;--muted:#a3adbc;--text:#eef1f6;--orange:#ffb544;--green:#69d6aa;--red:#ff9999}*{box-sizing:border-box}body{margin:0;padding-top:24px;background:radial-gradient(ellipse at 50% 0,#292f3a 0,transparent 62%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.65}button,select{font:inherit}button{cursor:pointer;border:1px solid #424b5b;background:#303744;color:var(--text);border-radius:8px;padding:11px 22px;font-weight:600}button:hover{filter:brightness(1.12)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffb544;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.42;filter:none}.primary{background:var(--orange);border-color:var(--orange);color:#191b20}.link{border:0;background:none;color:var(--muted);padding:6px 0;font-weight:400}.top{max-width:1000px;margin:28px auto 18px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--orange)}h1{font-size:21px;margin:3px 0} .demo-label{font-size:12px;border:1px solid #605039;border-radius:30px;padding:6px 12px;color:#f5c77e;white-space:nowrap}.toolbar{max-width:960px;margin:0 auto 18px;padding:15px 20px;background:#20252f;border:1px solid #353e4c;border-radius:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar label{color:var(--muted);font-size:12px}select{padding:8px 30px 8px 12px;background:#151922;color:var(--text);border:1px solid #465163;border-radius:6px;max-width:100%}.toolbar .reset{margin-left:auto;padding:6px 12px;font-size:12px}.window{max-width:960px;margin:0 auto 22px;background:var(--panel);border:1px solid #3b424e;border-radius:16px;overflow:hidden;box-shadow:0 24px 90px #0005}.titlebar{height:54px;background:#252a33;display:flex;justify-content:space-between;align-items:center;padding:0 28px;border-bottom:1px solid #363e4a}.brand{font-size:13px;font-weight:750;letter-spacing:1px;color:#ffc367}.titlebar span:last-child{color:var(--muted);font-size:12px}.main{padding:30px 34px 24px;min-height:620px}h2{font-size:27px;line-height:1.4;margin:0 0 10px;letter-spacing:-.5px}.subtitle{color:var(--muted);margin:0 0 24px}.rows{display:grid;gap:12px}.row{display:flex;align-items:center;gap:16px;min-height:92px;border:1px solid #343c49;border-radius:10px;padding:18px;background:var(--card)}.row.selected{border-color:#6a5533}.row input{width:18px;height:18px;accent-color:var(--orange);flex-shrink:0}.num{background:#363f4e;border-radius:8px;height:34px;width:34px;display:grid;place-items:center;color:#ffd28b;font-size:12px;font-weight:700;flex-shrink:0}.row .copy{flex:1;min-width:0}.name{font-size:16px;font-weight:600}.desc{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:12px;white-space:nowrap;padding:5px 9px;background:#1c222c;border-radius:6px;color:var(--muted)}.good{color:var(--green)}.warn{color:#ffc56f}.bad{color:var(--red)}.notice{margin-top:20px;padding:16px 18px;border:1px solid #5b4830;background:#30291f;border-radius:10px;color:#f4c783;font-size:13px}.notice small{display:block;color:#cdb894;font-size:12px;margin-top:5px}.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:28px;flex-wrap:wrap}.actions .left{margin-right:auto}.foot{color:#8e99aa;font-size:11px;margin:20px 0 0}.steps{max-width:960px;display:flex;gap:8px;margin:0 auto 32px;color:#8e99aa;font-size:12px;justify-content:center;flex-wrap:wrap}.steps span{padding:5px 12px}.steps .active{color:#ffd18a;background:#342c22;border-radius:30px}dialog{width:min(560px,calc(100% - 32px));border:1px solid #525b6a;border-radius:14px;background:#222731;color:var(--text);padding:28px;box-shadow:0 20px 100px #0009}dialog::backdrop{background:#080b12b8;backdrop-filter:blur(5px)}dialog h3{font-size:21px;margin:0 0 12px}dialog p{color:#bcc4d1;font-size:13px}dialog .notice{margin:16px 0}.consent{display:flex;align-items:flex-start;gap:9px;margin:20px 0;font-size:13px}.consent input{accent-color:var(--orange);width:17px;height:17px}.meter{height:5px;background:#3a4250;border-radius:6px;margin-top:22px;overflow:hidden}.meter i{display:block;height:100%;background:var(--orange);transition:width .4s}.log{white-space:pre-wrap;background:#141922;padding:16px;border-radius:8px;font-size:12px;color:#c1ccd9;max-height:300px;overflow:auto}.safe{font-size:12px;color:#909bad;max-width:960px;margin:0 auto 16px;text-align:center}.result-icon{font-size:24px;vertical-align:baseline;margin-right:8px}.record{background:#252b35;padding:16px 18px;border-radius:8px;margin-top:18px;font-size:13px} @media(max-width:700px){.top{margin-top:18px}.toolbar,.window{margin-left:12px;margin-right:12px}.main{padding:24px 18px;min-height:0}h2{font-size:23px}.titlebar{padding:0 18px}.row{padding:14px;gap:10px;flex-wrap:wrap}.row .copy{flex-basis:65%}.status{margin-left:auto}.actions{gap:8px}.actions button{padding:10px 15px}.toolbar .reset{margin-left:0}.safe{padding:0 16px}.num{width:28px;height:28px}.desc{font-size:12px}}
</style></head><body>
<section class="toolbar" aria-label="演示控制台"><label for="scenario">演示情景</label><select id="scenario"><option value="success">修复成功</option><option value="partial">部分修复失败</option><option value="failure">全部修复失败</option></select><button class="reset" id="all">选中三项体验完整流程</button><button class="reset" id="reset">重置演示</button></section>
<div class="window"><main class="main" id="app" aria-live="polite"></main></div><p class="safe">所有权限、修复、备份和重启状态均为模拟；没有系统命令、文件修改或网络请求。</p>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<script>
const app=document.getElementById('app'),modal=document.getElementById('modal'),scenario=document.getElementById('scenario');
const names=['Steam 客户端','内存完整性','虚拟化兼容设置'];
const descriptions=['备份启动相关数据，重启 Steam 并请求重新生成。','关闭此项 Windows 安全保护，修改后需手动重启电脑。','关闭两项虚拟化相关启动设置，修改后需手动重启。'];
let selected=[true,false,false],view='home',busy=false,records=[false,false,false],pending=[false,false,false],off=[false,false,false],results=[],logs=[],run=0,restoring=false;
function on(id,event,fn){const el=document.getElementById(id);if(el)el.addEventListener(event,fn)}
function notice(title,body){return `<div class="notice">${title}<small>${body}</small></div>`}
function actions(content){return `<div class="actions">${content}</div>`}
function button(id,label,primary=false,left=false){return `<button id="${id}" class="${primary?'primary ':''}${left?'left':''}">${label}</button>`}
function base(title,sub,body,buttons,foot='仅调整启动环境，不修改游戏文件与存档；不保证解决所有闪退。'){app.innerHTML=`<h2>${title}</h2><p class="subtitle">${sub}</p>${body}${actions(buttons)}<p class="foot">${foot}</p>`;scenario.disabled=busy;document.getElementById('all').disabled=busy||view!=='home';}
function status(i){if(pending[i])return ['待手动重启','warn'];if(off[i])return ['当前已关闭，无需修改','good'];return [i?'当前开启':'可执行','']}
function row(i,res,checkbox=false){const st=res||{text:status(i)[0],cls:status(i)[1],desc:descriptions[i]};return `<label class="row ${checkbox&&selected[i]?'selected':''}">${checkbox?`<input type="checkbox" data-item="${i}" ${selected[i]?'checked':''} ${pending[i]||off[i]?'disabled':''} aria-label="选择${names[i]}">`:''}<span class="num">${res&&res.kind==='done'?'✓':String(i+1).padStart(2,'0')}</span><span class="copy"><span class="name">${names[i]}</span><div class="desc">${st.desc||descriptions[i]}</div></span><span class="status ${st.cls||''}">${st.text}</span></label>`}
function home(){view='home';restoring=false;let body=`<div class="rows">${names.map((_,i)=>row(i,null,true)).join('')}</div>`+`<div class="notice" id="operation-notice"><strong>操作前请退出游戏和 Steam，并保存工作。</strong><small><b>修复：</b>将重启 Steam，并按所选项目尝试关闭内存完整性及虚拟化相关功能。系统项需要管理员权限，修改后需手动重启电脑。</small><small><b>安全影响：</b>关闭系统项会降低系统安全保护，可能影响 WSL2、Docker、Windows 沙盒及部分设备加密，请按需选择。</small><small><b>恢复：</b>将退出 Steam，仅还原最近一次客户端备份及本工具保存的系统原设置；没有有效记录的项目无法恢复。恢复安全设置可能受驱动或系统限制影响，不兼容时可能无法启用或出现系统异常；系统项恢复同样需要管理员权限及手动重启。</small><small><b>异常处理：</b>异常时停止对应项目并保留记录，如实展示未完成项，不将部分成功提示为全部成功。</small><small>仅调整启动环境，不修改游戏文件与存档；Steam 的下载和重新生成由客户端自行完成，操作完成不代表游戏故障已解决。</small></div>`;if(pending.some(Boolean))body+=`<div class="record warn">有设置等待重启。请手动重启后，点击“模拟已手动重启”，再重新检测。 ${button('reboot','模拟已手动重启')}</div>`;base('Steam 环境修复','尝试排除 Steam 客户端及 Windows 安全设置带来的启动兼容性问题。',body,button('restore','恢复原设置',false,true)+button('detect','重新检测')+button('repair','修复所选项目',true));document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('change',()=>{selected[Number(el.dataset.item)]=el.checked;home()}));document.getElementById('repair').disabled=!selected.some((s,i)=>s&&!off[i]&&!pending[i]);document.getElementById('restore').disabled=!records.some(Boolean);on('repair','click',confirmRepair);on('restore','click',restoreConfirm);on('detect','click',()=>{logs.push('只读重新检测（模拟）');home();popup('检测完成','当前展示的是模拟环境状态，不会进行真实的 Windows 检测。')});on('reboot','click',simulateReboot)}
function popup(title,body,buttons=''){modal.innerHTML=`<h3 id="modal-title">${title}</h3><div>${body}</div>${actions(buttons||button('close-modal','我知道了',true))}`;modal.showModal();on('close-modal','click',()=>modal.close())}
function confirmRepair(){const items=selected.map((s,i)=>s&&!pending[i]&&!off[i]?i:-1).filter(i=>i>=0);if(items.length)execute(items,false)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function execute(items,restore=false,denied=false){const token=++run;busy=true;restoring=restore;view='running';results=names.map((_,i)=>({text:items.includes(i)?'等待执行':'未选择',cls:'',kind:items.includes(i)?'wait':'skip'}));const prefix=restore?'恢复':'处理';function paint(n){base(`正在${prefix}，请勿关闭工具`,restore?'仅还原本演示记录过的修改，不执行新的环境优化。':'正在执行所选操作。备份与写入阶段请勿中断。',`<div class="rows">${results.map((r,i)=>row(i,r)).join('')}</div><div class="meter" aria-label="当前执行阶段"><i style="width:${n/items.length*100}%"></i></div><p class="subtitle" style="margin-top:12px">阶段 ${Math.min(n+1,items.length)} / ${items.length} · 模拟操作</p>`,button('working','处理中，请稍候'));document.getElementById('working').disabled=true}paint(0);for(let n=0;n<items.length;n++){const i=items[n];results[i]={text:'正在执行',cls:'warn',kind:'working',desc:restore?'正在恢复原设置（模拟）。':'正在保存原记录并执行操作（模拟）。'};paint(n);await wait(700);if(token!==run)return;let fails=(restore?false:scenario.value==='failure'||scenario.value==='partial'&&i===2);if(denied&&i>0)results[i]={text:'未执行',cls:'bad',kind:'fail',desc:'未获得管理员权限，未执行系统修改。'};else if(fails)results[i]={text:'执行失败',cls:'bad',kind:'fail',desc:restore?'恢复未完成，保留恢复记录；请重试或联系管理员。':(i===0?'Steam 相关文件被占用，请退出 Steam 后重试。':i===2?'未能修改启动设置，请按提示重试或联系管理员。':'未能写入系统设置，请重试或联系管理员。')};else {records[i]=!restore;if(i>0)pending[i]=true;results[i]={text:restore?(i?'已恢复，等待重启':'已恢复原文件'):(i?'已调整，等待重启':'已请求重新生成'),cls:i?'warn':'good',kind:'done',desc:i?'设置操作完成，需手动重启；目前不宣称已生效。':'后续由 Steam 自行完成，不判断下载是否完成。'}}logs.push(`${new Date().toLocaleTimeString()} ${restore?'恢复':'修复'} ${names[i]}：${results[i].text}`);paint(n+1)}busy=false;if(token!==run)return;resultView()}
function resultView(){view='result';const fails=results.filter(r=>r.kind==='fail').length,done=results.filter(r=>r.kind==='done').length,needsReboot=pending.some(Boolean);let title=fails?(done?'部分'+(restoring?'恢复':'修复')+'未完成':(restoring?'恢复':'修复')+'未完成'):(needsReboot?'操作已完成，请手动重启电脑':'操作已完成');let hint=needsReboot?'部分设置已修改，请先保存工作并手动重启电脑。':fails?'请根据各项提示处理后重试。':'请等待 Steam 自行完成处理，再尝试运行游戏。';base(`<span class="result-icon ${fails?'bad':'good'}">${fails?'!':'✓'}</span>${title}`,`${done} 项操作已处理，${fails} 项未完成。操作结果不代表游戏故障已经解决。`,`<div class="rows">${results.map((r,i)=>row(i,r)).join('')}</div>`+notice(hint,needsReboot?'工具不会替你重启，也不会在重启后自动运行或自动校验；重启后可手动打开并重新检测。':'Steam 下载与生成由客户端自行完成，工具不验证游戏是否已修复。'),button('return','返回首页')+(fails&&!needsReboot?button('retry','重新检测并重试',true):button('ok','我知道了',true)));on('return','click',home);on('ok','click',home);on('retry','click',()=>{if(restoring)restoreConfirm();else {selected=results.map(r=>r.kind==='fail');home();confirmRepair()}})}
function restoreConfirm(){const items=records.map((r,i)=>r?i:-1).filter(i=>i>=0);if(items.length)execute(items,true)}
function simulateReboot(){pending.forEach((p,i)=>{if(p){off[i]=records[i];pending[i]=false}});logs.push('用户模拟手动重启完成；由用户主动重新打开查看状态。');home()}
function reset(){run++;busy=false;records=[false,false,false];pending=[false,false,false];off=[false,false,false];selected=[true,false,false];logs=[];restoring=false;if(modal.open)modal.close();home()}
on('scenario','change',reset);on('reset','click',reset);on('all','click',()=>{selected=[true,!off[1]&&!pending[1],!off[2]&&!pending[2]];home()});home();
</script></body></html>
